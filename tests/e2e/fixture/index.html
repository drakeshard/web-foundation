<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drakeshard Browser Smoke</title>
</head>
<body>
  <main data-testid="smoke-root">browser-smoke-ready</main>
  <section>
    <div
      data-testid="input-surface"
      style="width: 320px; height: 180px; border: 1px solid black;"
    >
      input-surface
    </div>
    <button type="button" data-testid="consume-tick">consume tick</button>
    <button type="button" data-testid="activate-modal">activate modal</button>
    <button type="button" data-testid="deactivate-modal">deactivate modal</button>
    <button type="button" data-testid="enqueue-command">enqueue command</button>
    <output data-testid="lifecycle-state"></output>
    <output data-testid="context-state"></output>
    <pre data-testid="physical-log"></pre>
    <pre data-testid="tick-snapshot"></pre>
  </section>
  <section>
    <button type="button" data-testid="settings-write">write settings</button>
    <button type="button" data-testid="settings-read">read settings</button>
    <button type="button" data-testid="settings-remove">remove settings</button>
    <button type="button" data-testid="settings-corrupt">corrupt settings</button>
    <pre data-testid="settings-result"></pre>
  </section>
  <script type="module" src="./input.ts"></script>
  <script type="module" src="./settings.ts"></script>
</body>
</html>
