<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drakeshard Phaser Renderer Probe</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111827;
      color: #f9fafb;
      font-family: sans-serif;
    }

    main {
      display: grid;
      gap: 1rem;
      justify-items: start;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Phaser Renderer Probe</h1>
    <div id="renderer-probe"></div>
    <output data-testid="renderer-probe-status">booting</output>
    <section>
      <button type="button" data-testid="activate-modal">activate modal</button>
      <button type="button" data-testid="deactivate-modal">deactivate modal</button>
      <pre data-testid="input-contexts"></pre>
      <pre data-testid="domain-state"></pre>
      <pre data-testid="frame-state"></pre>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
