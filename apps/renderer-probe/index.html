<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drakeshard Phaser Renderer Probe</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111827;
      color: #f9fafb;
      font-family: sans-serif;
    }

    main {
      display: grid;
      gap: 1rem;
      justify-items: start;
      padding: 1rem;
    }

    #probe-ui section,
    #probe-ui div,
    .probe-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Phaser Renderer Probe</h1>
    <div id="renderer-probe"></div>
    <output data-testid="renderer-probe-status">booting</output>
    <div id="probe-ui"></div>
    <section class="probe-controls" aria-label="Persistence controls">
      <button type="button" data-testid="save-probe">save</button>
      <button type="button" data-testid="load-probe">load</button>
      <button type="button" data-testid="seed-corrupt-save">seed corrupt save</button>
      <output data-testid="persistence-state">idle</output>
    </section>
    <section class="probe-controls" aria-label="Cross-renderer scenario">
      <button type="button" data-testid="run-cross-renderer-scenario">run cross-renderer scenario</button>
      <pre data-testid="cross-renderer-scenario-result"></pre>
    </section>
    <section id="probe-debug" aria-label="Probe debug observations"></section>
    <section>
      <pre data-testid="input-contexts"></pre>
      <pre data-testid="domain-state"></pre>
      <pre data-testid="frame-state"></pre>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
