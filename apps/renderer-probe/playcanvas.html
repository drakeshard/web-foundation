<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drakeshard PlayCanvas Renderer Probe</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111827;
      color: #f9fafb;
      font-family: sans-serif;
    }

    main {
      display: grid;
      gap: 1rem;
      justify-items: start;
      padding: 1rem;
    }

    #playcanvas-probe {
      width: 640px;
      height: 480px;
    }

    #playcanvas-probe canvas {
      display: block;
      width: 640px;
      height: 480px;
    }

    .probe-data {
      display: grid;
      gap: 0.5rem;
    }

    .probe-data pre {
      margin: 0;
      max-width: 640px;
      white-space: pre-wrap;
    }

    .probe-actions {
      display: flex;
      gap: 0.5rem;
    }

    #playcanvas-ui {
      max-width: 640px;
    }
  </style>
</head>
<body>
  <main>
    <h1>PlayCanvas Renderer Probe</h1>
    <div id="playcanvas-probe"></div>
    <div id="playcanvas-ui"></div>
    <output data-testid="playcanvas-probe-status">booting</output>
    <p>Right-drag to pan. Use the mouse wheel to zoom. Left-click selects the toy world.</p>
    <div class="probe-data">
      <pre data-testid="playcanvas-camera-state"></pre>
      <pre data-testid="playcanvas-presentation-sync"></pre>
      <pre data-testid="playcanvas-elevation-demo-state"></pre>
      <pre data-testid="playcanvas-input-contexts"></pre>
      <pre data-testid="playcanvas-pointer-result"></pre>
      <pre data-testid="playcanvas-selection-intent"></pre>
      <pre data-testid="playcanvas-ui-intent"></pre>
      <pre data-testid="playcanvas-domain-state"></pre>
    </div>
    <div class="probe-actions">
      <button type="button" data-testid="playcanvas-elevation-demo-advance">advance elevation demo</button>
      <button type="button" data-testid="playcanvas-sync">sync presentation</button>
      <button type="button" data-testid="playcanvas-rebuild">rebuild presentation</button>
      <output data-testid="playcanvas-rebuild-count">0</output>
    </div>
    <div class="probe-actions" aria-label="PlayCanvas persistence controls">
      <button type="button" data-testid="playcanvas-save">save</button>
      <button type="button" data-testid="playcanvas-load">load</button>
      <output data-testid="playcanvas-persistence-state">idle</output>
    </div>
  </main>
  <script type="module" src="/src/playcanvas-main.ts"></script>
</body>
</html>
