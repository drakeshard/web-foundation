name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify release version and tagged commit
        run: >-
          node scripts/validate-release-version.mjs
          --tag "${{ github.event.release.tag_name }}"
          --release-commit "${{ github.sha }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publication candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          pnpm typecheck
          pnpm test
          pnpm test:npm-package-shape
          pnpm build
          pnpm test:public-api
          pnpm test:consumer
          pnpm test:release-candidate

      - name: Pack reviewed packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          pnpm --dir packages/foundation pack --pack-destination ../../release-artifacts
          pnpm --dir packages/testing pack --pack-destination ../../release-artifacts
          ls -la release-artifacts

      - name: Publish Foundation
        id: publish-foundation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          if npm view "@drakeshard/foundation@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@drakeshard/foundation@${VERSION} already exists; skipping."
            echo "disposition=already-present" >> "$GITHUB_OUTPUT"
          else
            set +e
            PUBLISH_OUTPUT="$(npm publish "./release-artifacts/drakeshard-foundation-${VERSION}.tgz" --access public 2>&1)"
            PUBLISH_STATUS=$?
            set -e
            printf '%s\n' "$PUBLISH_OUTPUT"

            if [ "$PUBLISH_STATUS" -eq 0 ]; then
              echo "disposition=published" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$PUBLISH_OUTPUT" | grep -q 'previously staged version'; then
              echo "@drakeshard/foundation@${VERSION} is already staged by npm; continuing to bounded registry verification."
              echo "disposition=already-present" >> "$GITHUB_OUTPUT"
            else
              exit "$PUBLISH_STATUS"
            fi
          fi

      - name: Publish Testing
        id: publish-testing
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          if npm view "@drakeshard/testing@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@drakeshard/testing@${VERSION} already exists; skipping."
            echo "disposition=already-present" >> "$GITHUB_OUTPUT"
          else
            set +e
            PUBLISH_OUTPUT="$(npm publish "./release-artifacts/drakeshard-testing-${VERSION}.tgz" --access public 2>&1)"
            PUBLISH_STATUS=$?
            set -e
            printf '%s\n' "$PUBLISH_OUTPUT"

            if [ "$PUBLISH_STATUS" -eq 0 ]; then
              echo "disposition=published" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$PUBLISH_OUTPUT" | grep -q 'previously staged version'; then
              echo "@drakeshard/testing@${VERSION} is already staged by npm; continuing to bounded registry verification."
              echo "disposition=already-present" >> "$GITHUB_OUTPUT"
            else
              exit "$PUBLISH_STATUS"
            fi
          fi

      - name: Verify npm registry consumption
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          node scripts/validate-npm-registry.mjs "$VERSION"

      - name: Create durable release evidence
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          node scripts/create-release-evidence.mjs \
            --version "${VERSION}" \
            --tag "${{ github.event.release.tag_name }}" \
            --artifacts-dir release-artifacts \
            --output-dir release-evidence \
            --foundation-publish-status "${{ steps.publish-foundation.outputs.disposition }}" \
            --testing-publish-status "${{ steps.publish-testing.outputs.disposition }}"

      - name: Upload release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            release-evidence/release-evidence.json \
            release-evidence/release-evidence.md \
            release-evidence/npm-audit-signatures.json \
            --clobber
